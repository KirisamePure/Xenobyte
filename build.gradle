// Minecraft 1.7.10 / Forge 10.13.4.1614 build using RetroFuturaGradle
// (https://github.com/GTNewHorizons/RetroFuturaGradle), the maintained
// replacement for ForgeGradle 1.2, whose download URLs no longer exist.
//
// Gradle itself needs Java 17+; the mod is compiled with a Java 8 toolchain
// (auto-downloaded if missing).
//
//   gradlew build      -> build/libs/xenobyte-1.0.0.jar (ProGuard + reobf), mainclass.txt
//   gradlew runClient  -> dev client in ./run

plugins {
    id "java"
    id "idea"
    id "com.gtnewhorizons.retrofuturagradle" version "1.4.9"
}

version = "1.0.0"
group = "forgefuck.team.xenobyte"
base.archivesName = "xenobyte"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

minecraft {
    mcVersion = "1.7.10"
    username = "Developer"
}

repositories {
    maven {
        name = "GTNH"
        url = "https://nexus.gtnewhorizons.com/repository/public/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
    mavenCentral()
}

configurations {
    bundle
    implementation.extendsFrom bundle
}

dependencies {
    bundle fileTree(dir: "libs", includes: ["*.jar"])
}

jar {
    from {
        configurations.bundle.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", minecraft.mcVersion
    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": minecraft.mcVersion.get()
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

// ---------------------------------------------------------------------------
// ProGuard obfuscation of the mod's own classes: dev jar -> ProGuard -> reobf
// ---------------------------------------------------------------------------

def proguardDir = layout.buildDirectory.dir("proguard")
def devJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
def proguardedJar = proguardDir.map { it.file("xenobyte-proguarded.jar") }
def proguardMap = layout.buildDirectory.file("libs/proguard-xenobyte-${version}.jar.map")
def java8Launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }

def randomWords = { int count ->
    def alphabet = (('a'..'z') + ('A'..'Z') + ('0'..'9')).join()
    def rnd = new Random()
    (1..count).collect { (1..16).collect { alphabet[rnd.nextInt(alphabet.length())] }.join() }.join("\n") + "\n"
}

def generateDictionary = tasks.register("generateDictionary") {
    def dir = proguardDir.get().asFile
    outputs.files(new File(dir, "class-dictionary.txt"), new File(dir, "package-dictionary.txt"), new File(dir, "fieldmethod-dictionary.txt"))
    doLast {
        dir.mkdirs()
        ["class", "package", "fieldmethod"].each {
            def f = new File(dir, "${it}-dictionary.txt")
            if (!f.exists()) {
                f.text = randomWords(10000)
            }
        }
    }
}

def obfuscateProGuard = tasks.register("obfuscateProGuard", JavaExec) {
    dependsOn generateDictionary
    def libraries = sourceSets.main.compileClasspath
    inputs.file(devJar)
    inputs.files(libraries)
    outputs.file(proguardedJar)
    outputs.file(proguardMap)
    javaLauncher = java8Launcher
    classpath = files("proguard/lib/proguard.jar")
    mainClass = "proguard.ProGuard"
    def config = proguardDir.map { it.file("proguard.pro") }
    args "@" + config.get().asFile.absolutePath
    doFirst {
        def dir = proguardDir.get().asFile
        def javaHome = java8Launcher.get().metadata.installationPath.asFile
        def q = { File f -> "'" + f.absolutePath + "'" }
        def lines = []
        lines << "-injars " + q(devJar.get().asFile)
        lines << "-outjars " + q(proguardedJar.get().asFile)
        ["lib/rt.jar", "jre/lib/rt.jar", "lib/jce.jar", "jre/lib/jce.jar"].each {
            def f = new File(javaHome, it)
            if (f.exists()) lines << "-libraryjars " + q(f)
        }
        libraries.files.findAll { it.exists() }.each { lines << "-libraryjars " + q(it) }
        lines << "-keepattributes RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations,RuntimeVisibleTypeAnnotations"
        lines << "-keep class !forgefuck.team.xenobyte.** { *; }"
        lines << "-classobfuscationdictionary " + q(new File(dir, "class-dictionary.txt"))
        lines << "-packageobfuscationdictionary " + q(new File(dir, "package-dictionary.txt"))
        lines << "-obfuscationdictionary " + q(new File(dir, "fieldmethod-dictionary.txt"))
        lines << "-dontshrink"
        lines << "-dontoptimize"
        lines << "-dontwarn"
        lines << "-ignorewarnings"
        lines << "-printmapping " + q(proguardMap.get().asFile)
        config.get().asFile.text = lines.join("\n") + "\n"
    }
}

def createJavaInjectorComment = tasks.register("createJavaInjectorComment") {
    dependsOn obfuscateProGuard
    inputs.file(proguardMap)
    def out = file("mainclass.txt")
    outputs.file(out)
    doLast {
        def m = proguardMap.get().asFile.text =~ /forgefuck\.team\.xenobyte\.api\.integration\.JavaInjector -> (.*?):/
        if (!m.find()) {
            throw new GradleException("JavaInjector not found in ProGuard mapping")
        }
        out.text = m.group(1)
    }
}

tasks.named("reobfJar") {
    dependsOn createJavaInjectorComment
    inputJar.set(proguardedJar)
}
